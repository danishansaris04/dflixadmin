<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-FLIX TV Update Admin</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#171922; --line:#2a2d3a; --text:#eceef5; --muted:#8b90a3;
    --accent:#27d3e6; --accent-ink:#06161a; --ok:#35c46b; --bad:#ff5d5d;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px 60px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:.2px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin:0 0 20px}
  .status{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
  .status.live .dot{background:var(--ok)}
  .status.off .dot{background:var(--muted)}
  .status b{font-weight:600}
  form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  label:first-of-type{margin-top:0}
  .hint{font-weight:400;color:var(--muted);font-size:13px}
  input,textarea{width:100%;background:#0e0f13;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit}
  textarea{min-height:84px;resize:vertical}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btns{display:flex;gap:10px;margin-top:18px}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}
  #pub{flex:1;background:var(--accent);color:var(--accent-ink)}
  #rm{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  button:disabled{opacity:.5;cursor:wait}
  .msg{margin-top:14px;padding:10px 12px;border-radius:8px;display:none;font-size:14px}
  .msg.ok{display:block;background:rgba(53,196,107,.12);color:var(--ok)}
  .msg.err{display:block;background:rgba(255,93,93,.12);color:var(--bad)}
  .note{color:var(--muted);font-size:13px;margin-top:18px}
  .note code{background:var(--panel);padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>D-FLIX <span>TV</span> Update</h1>
  <p class="sub">Yahan se publish kiya gaya update sirf TV app me jayega.</p>

  <div id="status" class="status off"><i class="dot"></i><div id="statusText">Loading current update...</div></div>

  <form id="f" autocomplete="off">
    <div class="row">
      <div>
        <label for="vc">Version Code <span class="hint">(number)</span></label>
        <input id="vc" type="number" min="1" step="1" required placeholder="2">
      </div>
      <div>
        <label for="vn">Version Name</label>
        <input id="vn" type="text" placeholder="1.1-tv">
      </div>
    </div>

    <label for="title">Title</label>
    <input id="title" type="text" placeholder="New update available">

    <label for="desc">Description <span class="hint">(kya naya hai)</span></label>
    <textarea id="desc" placeholder="Bug fixes aur naye features"></textarea>

    <label for="url">APK link <span class="hint">(direct download link)</span></label>
    <input id="url" type="url" required placeholder="https://.../dflix-tv.apk">

    <div class="btns">
      <button type="submit" id="pub">Publish update</button>
      <button type="button" id="rm">Remove</button>
    </div>
    <div id="msg" class="msg"></div>
  </form>

  <p class="note">Firebase node: <code>/app_update_tv</code>. Version Code app ke <code>AndroidManifest.xml</code> ke versionCode se zyada hona chahiye, tabhi popup aayega.</p>
</div>

<script>
var DB = "https://dflix-7b2d2-default-rtdb.firebaseio.com";
var NODE = "app_update_tv";
var URL_ = DB + "/" + NODE + ".json";
var $ = function (id) { return document.getElementById(id); };

function show(text, ok) {
  var m = $("msg");
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
}
function setStatus(d) {
  var s = $("status");
  if (d && d.url) {
    s.className = "status live";
    $("statusText").innerHTML = "Live: <b>Version " + (d.versionName ? esc(d.versionName) + " " : "") + "(code " + esc(d.versionCode) + ")</b>";
  } else {
    s.className = "status off";
    $("statusText").textContent = "Abhi koi update live nahi hai";
  }
}
function esc(v) {
  var d = document.createElement("div");
  d.textContent = v == null ? "" : v;
  return d.innerHTML;
}
function load() {
  fetch(URL_ + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      setStatus(d);
      if (d) {
        $("vc").value = d.versionCode || "";
        $("vn").value = d.versionName || "";
        $("title").value = d.title || "";
        $("desc").value = d.description || "";
        $("url").value = d.url || "";
      }
    })
    .catch(function (e) {
      $("statusText").textContent = "Current update load nahi hua (" + e.message + ")";
    });
}
function busy(b) { $("pub").disabled = b; $("rm").disabled = b; }

$("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var code = parseInt($("vc").value, 10);
  var link = $("url").value.trim();
  if (!code || code < 1) return show("Version Code ek number hona chahiye (1 ya zyada).", false);
  if (!/^https?:\/\//i.test(link)) return show("APK link http ya https se shuru hona chahiye.", false);
  var data = {
    versionCode: code,
    versionName: $("vn").value.trim(),
    title: $("title").value.trim() || "A new update is available",
    description: $("desc").value.trim(),
    url: link,
    target: "tv",
    publishedAt: Date.now()
  };
  busy(true);
  fetch(URL_, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status + " - Firebase rules check karo"); return r.json(); })
    .then(function (d) { setStatus(d); show("Published. TV app ab update dikhayegi.", true); })
    .catch(function (e) { show("Publish nahi hua: " + e.message, false); })
    .then(function () { busy(false); });
});

$("rm").addEventListener("click", function () {
  if (!confirm("TV ka update popup band kar dein?")) return;
  busy(true);
  fetch(URL_, { method: "DELETE" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); })
    .then(function () { setStatus(null); $("f").reset(); show("Removed. Ab koi update popup nahi dikhega.", true); })
    .catch(function (e) { show("Remove nahi hua: " + e.message, false); })
    .then(function () { busy(false); });
});

load();
</script>
</body>
</html>
